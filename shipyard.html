<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse the Naval Command ship profile registry." />
    <title>Shipyard — Naval Command</title>
    <link rel="icon" href="favicon.svg?v=navy-7" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=navy-7" />
    <script src="data.js?v=navy-7" defer></script>
    <script src="app.js?v=navy-7" defer></script>
  </head>
  <body class="selection-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="lobby.html?v=navy-7" aria-label="Return to Home Port">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>Naval Command</span>
      </a>
      <a class="back-link" href="lobby.html?v=navy-7">
        <span aria-hidden="true">←</span> Home Port
      </a>
    </header>

    <main class="selection-shell">
      <section class="selection-intro" aria-labelledby="page-title">
        <p class="eyebrow">Shipyard registry</p>
        <h1 id="page-title">Ship profiles.</h1>
        <p class="intro-copy">Select a profile to view its details.</p>
      </section>

      <section aria-label="Warship roster">
        <div class="roster" id="character-roster"></div>
      </section>

      <p class="selection-hint">
        <span class="hint-icon" aria-hidden="true">↗</span>
        Select a profile to view details
      </p>

      <div class="selection-controls">
        <button class="alternate-toggle" id="alternate-toggle" type="button" aria-pressed="false">
          <span class="toggle-symbol" aria-hidden="true">◈</span>
          <span class="toggle-label">切换副图</span>
        </button>
      </div>
    </main>

    <footer class="site-footer">
      <span>24 profile records</span>
      <span class="footer-rule" aria-hidden="true"></span>
      <span>Registry view</span>
    </footer>
  </body>
</html>
