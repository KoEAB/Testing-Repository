name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$SITE_URL?v=navy-58" --output /tmp/published-index.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/lobby.html?v=navy-58" --output /tmp/published-lobby.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/shipyard.html?v=navy-58" --output /tmp/published-shipyard.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/campaign.html?v=navy-58" --output /tmp/published-campaign.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/combat-demo.html?v=navy-58" --output /tmp/published-combat-demo.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/combat-demo.js?v=navy-58" --output /tmp/published-combat-demo.js \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/map-terrain-data.js?v=navy-58" --output /tmp/published-map-terrain-data.js \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/ship-combat-data.js?v=navy-58" --output /tmp/published-ship-combat-data.js \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/concealment-demo.html?v=navy-58" --output /tmp/published-concealment-demo.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/shop.html?v=navy-58" --output /tmp/published-shop.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/shipbuilding.html?v=navy-58" --output /tmp/published-shipbuilding.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/gear.html?v=navy-58" --output /tmp/published-gear.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/data.js?v=navy-58" --output /tmp/published-data.js \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/app.js?v=navy-58" --output /tmp/published-app.js \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/character.js?v=navy-58" --output /tmp/published-character.js \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/images/warships/enterprise-shipyard-icon.png?v=navy-58" --output /tmp/enterprise.png \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/images/warships/lexington-shipyard-icon.png?v=navy-58" --output /tmp/lexington.png \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/images/warships/hornet-shipyard-icon.png?v=navy-58" --output /tmp/hornet.png \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/images/warships/yorktown-shipyard-icon.png?v=navy-58" --output /tmp/yorktown.png \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/images/ammo/ap.png?v=navy-58" --output /tmp/ammo-ap.png \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/images/ammo/he.png?v=navy-58" --output /tmp/ammo-he.png \
              && grep --fixed-strings --quiet "Click to start" /tmp/published-index.html \
              && grep --fixed-strings --quiet 'window.NAVAL_MAP_TERRAIN' /tmp/published-map-terrain-data.js \
              && grep --fixed-strings --quiet 'map-terrain-data.js?v=navy-58' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'href="lobby.html?v=navy-58"' /tmp/published-index.html \
              && grep --fixed-strings --quiet 'href="campaign.html?v=navy-58"' /tmp/published-lobby.html \
              && grep --fixed-strings --quiet '<strong>Combat</strong>' /tmp/published-lobby.html \
              && grep --fixed-strings --quiet 'href="combat-demo.html?v=navy-58"' /tmp/published-campaign.html \
              && grep --fixed-strings --quiet 'href="concealment-demo.html?v=navy-58"' /tmp/published-campaign.html \
              && grep --fixed-strings --quiet 'data-mode="concealment"' /tmp/published-concealment-demo.html \
              && grep --fixed-strings --quiet 'DEFAULT_CONCEALMENT = 10' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'visibleToFriendly = ship.team !== "enemy" || ship.health <= 0 || detected' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'Combat demo' /tmp/published-campaign.html \
              && grep --fixed-strings --quiet 'id="hex-map-viewport"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'const shipTypes' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet '"northern-lights": { name: "Northern Lights", kilometers: 48, columns: 56, rows: 48' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet '"northern-waters": { name: "Northern Waters", kilometers: 42, columns: 49, rows: 42' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'id="developer-map"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="setup-mode-toggle"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="setup-code-input"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="terrain-edit-toggle"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="terrain-code-output"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'function exportTerrainCode' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function lineOfFireBlocked' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'landCells.add(cellKey(32, 22))' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function importSetup' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'const MOVE_RANGE = 5' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'const ATTACK_RANGE = 7' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'const TORPEDO_RANGE = 4' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'const WRECK_CLASSIFICATION' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'USS North Carolina' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'USS New Orleans' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'USS Fletcher' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'gunRange: 23' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'forwardFiringAngle: 32, backwardFiringAngle: 31, alphaDamage: 131, apShellVelocity: 701' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'forwardFiringAngle: 34, backwardFiringAngle: 30, alphaDamage: 46, apShellVelocity: 853' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'health: 660, speedKnots: 27.5, movementRange: 3' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'health: 170, speedKnots: 36.5, movementRange: 6' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet '"USS Helena": {' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet '"USS Des Moines": {' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'shellCount: 15, salvoPattern: [3, 3, 3, 3, 3]' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'gunRange: 16, gunAttacksPerTurn: 6' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'forwardFiringAngle: 30, backwardFiringAngle: 38, alphaDamage: 21, apShellVelocity: 792' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'heAlphaDamage: 57, heShellVelocity: 820, mainGunCaliberMm: 406' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'heAlphaDamage: 28, heShellVelocity: 853, mainGunCaliberMm: 203' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'heAlphaDamage: 18, heShellVelocity: 792, mainGunCaliberMm: 127' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'id="load-ap-shells"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="load-he-shells"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'src="images/ammo/ap.png"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'src="images/ammo/he.png"' /tmp/published-concealment-demo.html \
              && grep --fixed-strings --quiet 'id="unit-detail-ammo"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'function loadAmmunition' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'const AIM_RANGE = 3' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'id="unit-detail-speed"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="unit-detail-shell-velocity"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'ship-combat-data.js?v=navy-58' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'ship-combat-data.js?v=navy-58' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'id="unit-detail-turrets"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'const sternQuarter' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'const closeRangeProgress' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function resolveApSalvo' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function northCarolinaMissChance' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'id="unit-detail-last-salvo"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'gunAttacksPerTurn: 4' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'torpedoReloadDuration: 3' /tmp/published-ship-combat-data.js \
              && grep --fixed-strings --quiet 'function calculateMissChance' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'angleWhenFiring' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'data-inspect-sunk' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function refreshDeathMarkerVisibility' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'const UNIT_STATS' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function calculateReachable' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function lineCrossesLand' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function simplifyLandRoute' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'async function moveSelectedUnit' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'async function fireVolley' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'projectedDamage += preparedSalvo.totalDamage' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'projectedDamage >= targetHealthAtStart' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'async function fireTorpedoes' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function beginPlacement' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'id="unit-detail-panel"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="developer-panel"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="next-turn"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'id="turn-number"' /tmp/published-combat-demo.html \
              && grep --fixed-strings --quiet 'CVE: carrier' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'function setScale' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'href="shipyard.html?v=navy-58"' /tmp/published-lobby.html \
              && grep --fixed-strings --quiet 'href="shop.html?v=navy-58"' /tmp/published-lobby.html \
              && grep --fixed-strings --quiet 'href="shipbuilding.html?v=navy-58"' /tmp/published-lobby.html \
              && grep --fixed-strings --quiet 'href="gear.html?v=navy-58"' /tmp/published-lobby.html \
              && grep --fixed-strings --quiet 'id="alternate-toggle"' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'id="filter-toggle"' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'id="ship-search"' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'shipyard-quick-links' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'ship=USS%20Helena' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'ship=USS%20Des%20Moines' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'const heNonPenChance = destroyerTarget ? 0' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'id="type-filters"' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'id="rarity-filters"' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet "Select a profile to view its details" /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'name: "USS Enterprise"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Lexington"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Hornet"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Yorktown"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Saratoga"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Washington"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS San Francisco"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Atlanta"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Brooklyn"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Marblehead"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Madison"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Fletcher"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Helena"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Des Moines"' /tmp/published-data.js \
              && grep --fixed-strings --quiet '"Des Moines": { shipType: "Heavy cruiser", typeCode: "CA", rarity: "UR"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'combatStats: window.SHIP_COMBAT_DATA?.[ship.name]' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'combat-stats-section' /tmp/published-character.js \
              && grep --fixed-strings --quiet 'const minimumCitadelAngle = sizeAdvantage > 0 ? 45 : 65' /tmp/published-combat-demo.js \
              && grep --fixed-strings --quiet 'shipClass: "Yorktown"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'hullNumber: "CV-6"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'typeCode: "CV"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'rarity: "UR"' /tmp/published-data.js \
              && grep --fixed-strings --quiet '<div><dt>Hull number</dt><dd>${character.hullNumber}</dd></div>' /tmp/published-app.js \
              && grep --fixed-strings --quiet 'defaultImage: null' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'alternateImage: "images/warships/enterprise-shipyard-icon.png"' /tmp/published-data.js \
              && grep --fixed-strings --quiet '"墨潮"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'id="roster-total"' /tmp/published-shipyard.html \
              && grep --fixed-strings --quiet 'portrait=default' /tmp/published-app.js \
              && grep --fixed-strings --quiet 'show-alternate-portraits' /tmp/published-app.js \
              && grep --fixed-strings --quiet 'activeFilters' /tmp/published-app.js \
              && ! grep --fixed-strings --quiet '<blockquote>' /tmp/published-character.js \
              && ! grep --fixed-strings --quiet 'epithet:' /tmp/published-data.js; then
              echo "Published site includes four selectable combat maps, segmented actions, damaging attacks, developer fleet controls, filtering, and navigation routes."
              exit 0
            fi
            echo "Waiting for the published site (attempt $attempt of 12)..."
            sleep 5
          done
          echo "The published site did not return the expected page." >&2
          exit 1
