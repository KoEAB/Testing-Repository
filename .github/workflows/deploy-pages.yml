name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$SITE_URL?v=navy-2" --output /tmp/published-index.html \
              && curl --fail --silent --show-error --location "${SITE_URL%/}/data.js?v=navy-2" --output /tmp/published-data.js \
              && grep --fixed-strings --quiet "Choose your <em>warship" /tmp/published-index.html \
              && grep --fixed-strings --quiet 'name: "USS Enterprise"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Lexington"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Hornet"' /tmp/published-data.js \
              && grep --fixed-strings --quiet 'name: "USS Yorktown"' /tmp/published-data.js; then
              echo "Published site is responding with the navy theme and all four USS names."
              exit 0
            fi
            echo "Waiting for the published site (attempt $attempt of 12)..."
            sleep 5
          done
          echo "The published site did not return the expected page." >&2
          exit 1
