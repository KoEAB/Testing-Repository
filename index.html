<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Choose a legendary United States Navy aircraft carrier and open its fleet record."
    />
    <title>Naval Command — Choose Your Warship</title>
    <link rel="icon" href="favicon.svg?v=navy-2" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=navy-2" />
    <script src="data.js?v=navy-2" defer></script>
    <script src="app.js?v=navy-2" defer></script>
  </head>
  <body class="selection-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="index.html?v=navy-2" aria-label="Naval Command home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>Naval Command</span>
      </a>
      <span class="chapter-label">Pacific Fleet · 1942</span>
    </header>

    <main class="selection-shell">
      <section class="selection-intro" aria-labelledby="page-title">
        <p class="eyebrow">Assemble the task force</p>
        <h1 id="page-title">Choose your <em>warship.</em></h1>
        <p class="intro-copy">
          Four storied carriers stand ready. Choose a vessel to open its fleet
          record.
        </p>
      </section>

      <section aria-label="Warship roster">
        <div class="roster" id="character-roster"></div>
      </section>

      <p class="selection-hint">
        <span class="hint-icon" aria-hidden="true">↗</span>
        Select a warship to open its record
      </p>
    </main>

    <footer class="site-footer">
      <span>04 fleet records</span>
      <span class="footer-rule" aria-hidden="true"></span>
      <span>The Pacific awaits</span>
    </footer>
  </body>
</html>
